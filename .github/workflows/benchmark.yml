name: Benchmark this PR

on:
  # pull_request_target so GITHUB_TOKEN is issued with the declared
  # permissions in the base-repo context — pull_request gets a read-only
  # token on fork PRs and the results comment 403s. The job holds
  # contents:read + pull-requests:write and no secrets.
  pull_request_target:
    branches:
      - master
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Uses the action directly (rather than the SciML reusable workflow) so
      # bench-on can freeze the benchmark script + Project.toml to the PR head
      # instead of master — the PR itself may fix or extend benchmark/.
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: "1"
          bench-on: ${{ github.event.pull_request.head.sha }}
